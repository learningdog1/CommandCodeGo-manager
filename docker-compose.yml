services:
  ccp:
    # 默认拉 Docker Hub 现成镜像(CI 构建,linux/amd64 + arm64,公开直拉)
    image: cashewchickengazgazgood/commandcodego-manager:latest
    # 源码构建(改了代码或不想依赖镜像仓库):注释上面 image 行,启用下面这行
    # build: .
    # GHCR 同内容镜像:ghcr.io/learningdog1/commandcodego-manager:latest(默认 Private,
    # 匿名拉取需先在 Packages 设置改 Public)
    container_name: commandcodego
    restart: unless-stopped
    ports:
      # 只绑服务器本地,由 Nginx/Caddy 反代对外;纯内网直用可改为 "3050:3050"
      - "127.0.0.1:3050:3050"
    volumes:
      # SQLite 库 + config.json 全在数据目录,升级重建容器不丢数据
      - ./data:/app/data
