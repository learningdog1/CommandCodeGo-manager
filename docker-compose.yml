services:
  ccp:
    # 默认拉 Docker Hub 现成镜像(CI 构建,linux/amd64 + arm64,公开直拉)
    image: cashewchickengazgazgood/commandcodego-manager:latest
    # 源码构建(改了代码或不想依赖镜像仓库):注释上面 image 行,启用下面这行
    # build: .
    # GHCR 同内容镜像:ghcr.io/learningdog1/commandcodego-manager:latest(默认 Private,
    # 匿名拉取需先在 Packages 设置改 Public)
    container_name: commandcodego
    restart: unless-stopped
    ports:
      # 绑 0.0.0.0,公网/局域网直接可达;仅本机+反代使用可改回 "127.0.0.1:3050:3050"
      - "3050:3050"
    environment:
      # 管理界面鉴权令牌(仅设了才启用;公网部署必改!)
      # 生成强随机串:openssl rand -hex 24;改后 docker compose up -d 重建生效
      CCP_ADMIN_TOKEN: "change-me"
    volumes:
      # SQLite 库 + config.json 全在数据目录,升级重建容器不丢数据
      - ./data:/app/data
      # ── 可选:开启「一键导入」按钮(不挂载也能正常用,见文末替代方案)──
      # 前提:已在这台服务器上安装 commandcode CLI 并完成 cmd login,凭证写在
      #       宿主机 /root/.commandcode/auth.json(root 用户)。服务器上如何登录
      #       见 README「服务器上安装 commandcode CLI 并登录」一节。
      # 原因:一键导入只检测容器内的 /root/.commandcode/auth.json,容器默认
      #       看不到宿主机文件,必须把凭证目录只读挂进去。
      # 做法:root 登录 → 取消下一行注释,执行 docker compose up -d 重建即可;
      #       非 root 登录 → 改挂 ~/.commandcode:/cc-auth:ro,并在上方 environment
      #       加一行 CCP_CLI_AUTH_FILE=/cc-auth/auth.json,同样 up -d 重建。
      # 替代:不挂载也行 —— 网页「密钥管理 → 批量导入」直接粘贴 user_* 密钥,
      #       效果完全相同。
      # - /root/.commandcode:/root/.commandcode:ro
