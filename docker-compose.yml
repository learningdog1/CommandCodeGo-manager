services:
  ccp:
    # 默认拉 Docker Hub 现成镜像(CI 构建,linux/amd64 + arm64,公开直拉)
    image: cashewchickengazgazgood/commandcodego-manager:latest
    # 源码构建(改了代码或不想依赖镜像仓库):注释上面 image 行,启用下面这行
    # build: .
    # GHCR 同内容镜像:ghcr.io/learningdog1/commandcodego-manager:latest(默认 Private,
    # 匿名拉取需先在 Packages 设置改 Public)
    container_name: commandcodego
    restart: unless-stopped
    ports:
      # 绑 0.0.0.0,公网/局域网直接可达;仅本机+反代使用可改回 "127.0.0.1:3050:3050"
      - "3050:3050"
    environment:
      # 管理界面鉴权令牌(仅设了才启用;公网部署必改!)
      # 生成强随机串:openssl rand -hex 24;改后 docker compose up -d 重建生效
      CCP_ADMIN_TOKEN: "change-me"
    volumes:
      # SQLite 库 + config.json 全在数据目录,升级重建容器不丢数据
      - ./data:/app/data
      # 「一键导入」可选:CLI 登录凭证只读挂载进容器。检测读的是容器内文件系统的
      # /root/.commandcode/auth.json,宿主机上 cmd login 的凭证默认看不见——
      # root 用户在宿主机登录过 CLI 后,取消下面这行注释并 docker compose up -d 即可;
      # 非 root 用户改为 ~/.commandcode:/cc-auth:ro 并在 environment 加
      # CCP_CLI_AUTH_FILE=/cc-auth/auth.json。不挂载就走「批量导入」粘贴 user_* 密钥
      # - /root/.commandcode:/root/.commandcode:ro
