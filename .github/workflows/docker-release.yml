name: docker-release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# 原生 runner 矩阵构建(无 QEMU,快一个数量级):amd64 用 ubuntu-latest,
# arm64 用 ubuntu-24.04-arm(公开仓库免费)。各平台按 digest 推送,merge 阶段
# 组装多架构 manifest。GHCR 用内置 GITHUB_TOKEN,Docker Hub 用仓库 secrets
# (DOCKERHUB_USERNAME / DOCKERHUB_TOKEN,未配置时自动跳过只推 GHCR)。
permissions:
  contents: read
  packages: write

env:
  GHCR_IMAGE: ghcr.io/learningdog1/commandcodego-manager
  DH_IMAGE: docker.io/cashewchickengazgazgood/commandcodego-manager

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            os: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            os: ubuntu-24.04-arm
            suffix: arm64
    runs-on: ${{ matrix.os }}
    env:
      # secrets 不能进 step 的 if:,经 env 中转
      DH_READY: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to registries
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          if [ "$DH_READY" = true ]; then
            echo "$DH_TOKEN" | docker login -u "$DH_USER" --password-stdin
          fi

      # 按 digest 推 GHCR(不打 tag,merge 阶段统一打)。provenance 必须关:
      # 默认的证明清单含每次构建的调用元数据,同内容两次推送也会得到不同顶层
      # digest,导致「GHCR 的 digest 在 Docker Hub 命名空间下 not found」
      - name: Build and push by digest (GHCR)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          provenance: false
          outputs: type=image,name=${{ env.GHCR_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=build-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=build-${{ matrix.suffix }}

      # 同一镜像再推 Docker Hub:层缓存全命中,只上传 blob 到第二个 registry
      - name: Push by digest (Docker Hub)
        if: env.DH_READY == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          provenance: false
          outputs: type=image,name=${{ env.DH_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=build-${{ matrix.suffix }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.suffix }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    env:
      DH_READY: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Login to registries
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          if [ "$DH_READY" = true ]; then
            echo "$DH_TOKEN" | docker login -u "$DH_USER" --password-stdin
          fi

      # tag 规则:v* 标签 → 版本号(去 v)+ latest;手动触发 → latest
      - name: Create manifest lists and push
        working-directory: /tmp/digests
        run: |
          tags="latest"
          case "$GITHUB_REF" in
            refs/tags/v*) tags="$tags ${GITHUB_REF_NAME#v}" ;;
          esac
          images=("$GHCR_IMAGE")
          [ "$DH_READY" = true ] && images+=("$DH_IMAGE")
          for img in "${images[@]}"; do
            args=()
            for t in $tags; do args+=(-t "$img:$t"); done
            for f in *; do args+=("$img@sha256:$f"); done
            docker buildx imagetools create "${args[@]}"
            echo "pushed: $img  tags=[$tags]  platforms=$(ls | wc -l | tr -d ' ')"
          done
