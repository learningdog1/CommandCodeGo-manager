name: desktop-release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# release 任务用 GITHUB_TOKEN 创建 Release 并上传资产
permissions:
  contents: write

jobs:
  build-desktop:
    strategy:
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
          - os: windows-latest
            script: dist:win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
            desktop/package-lock.json

      # 1) Web UI 构建(产物 public/)
      - name: Build Web UI
        run: |
          npm --prefix web ci || npm --prefix web install
          npm run build:web

      # 2) 服务端单文件 bundle(产物 dist/commandcodego-manager.mjs)
      - name: Bundle server
        run: |
          npm ci || npm install
          npm run bundle

      # 3) 桌面打包(各平台原生构建,产物 release/)
      - name: Build desktop app
        working-directory: desktop
        run: |
          npm ci || npm install
          npm run ${{ matrix.script }}
        env:
          # 无签名证书:mac 走 ad-hoc,win 跳过签名
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # 4) 便携版自动更新包(issue #11):win-unpacked 整包打 zip,命名与
      #    desktop/updater.cjs 的 pickAsset 约定一致(Update-<版本>-<架构>.zip)。
      #    覆盖式替换跳过 data 目录,升级不动用户数据。
      - name: Package update archives (win)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = (Get-Content desktop/package.json | ConvertFrom-Json).version
          foreach ($arch in 'x64', 'arm64') {
            $src = if ($arch -eq 'x64') { 'release/win-unpacked' } else { "release/win-$arch-unpacked" }
            if (Test-Path $src) {
              Compress-Archive -Path "$src/*" -DestinationPath "release/CommandCodeGo.Manager-Update-$v-$arch.zip" -Force
            }
          }
          Get-ChildItem release/*.zip | Select-Object Name, Length

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: |
            release/*.dmg
            release/*.exe
            release/*-mac.zip
            release/*-Update-*.zip
          retention-days: 30

  # tag 推送时:汇总两平台产物,创建 GitHub Release 并挂载安装包
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-desktop
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # docker-release 与本工作流同 tag 并发,谁先建 Release 不确定;
      # create 撞「tag 已存在」时降级为向已有 Release 补传资产(v0.2.10 实测踩过)
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -R artifacts
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            artifacts/*.dmg artifacts/*.exe artifacts/*-mac.zip artifacts/*-Update-*.zip \
          || gh release upload "${GITHUB_REF_NAME}" \
            artifacts/*.dmg artifacts/*.exe artifacts/*-mac.zip artifacts/*-Update-*.zip --clobber
